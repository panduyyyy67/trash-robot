# Membuat folder android/ dan meng-commit-nya ke repositori (cukup dijalankan sekali).
# Berguna untuk alat yang mewajibkan android/ ada di proyek (Android Studio,
# `flutter run`, Codemagic, FlutLab, dll).
#
# Cara pakai: tab Actions -> "Generate android folder" -> Run workflow.
# Kalau push gagal (403): Settings -> Actions -> General -> Workflow permissions
# -> pilih "Read and write permissions", lalu jalankan ulang.

name: Generate android folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat kerangka proyek di folder sementara
        run: flutter create --platforms=android --org com.trashbot --project-name trashbot_app /tmp/scaffold

      - name: Salin dan atur android/ (izin kamera/internet, cleartext, minSdk 26)
        run: |
          rm -rf android
          cp -r /tmp/scaffold/android android
          [ -f .metadata ] || cp /tmp/scaffold/.metadata .metadata
          [ -f .gitignore ] || cp /tmp/scaffold/.gitignore .gitignore
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"|' "$MANIFEST"
          sed -i 's|minSdk = flutter.minSdkVersion|minSdk = 26|' android/app/build.gradle.kts || true
          sed -i 's|minSdkVersion flutter.minSdkVersion|minSdkVersion 26|' android/app/build.gradle || true
          grep -n "uses-permission\|usesCleartext" "$MANIFEST"
          grep -n "minSdk" android/app/build.gradle* || true

      - name: Commit android/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git add .metadata .gitignore 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan"
          else
            git commit -m "Tambah folder android/ (dibuat otomatis)"
            git push
          fi
